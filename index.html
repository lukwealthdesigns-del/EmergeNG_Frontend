<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEEBDA" />
    <meta name="description" content="EmergeNG — Locate • Alert • Respond. Share your exact emergency location using Nigeria's postcode." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:wght@500;600&display=swap" rel="stylesheet" />
    <title>EmergeNG</title>
    <script>
      // Apply saved theme + language before first paint (no flash). Light is the default. Keys match ThemeProvider / I18nProvider.
      (function () {
        var d = document.documentElement;
        try {
          var m = localStorage.getItem("emergeng.theme") || "light";
          var dark = m === "dark" || (m === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          d.setAttribute("data-theme", dark ? "dark" : "light");
          var l = localStorage.getItem("emergeng.lang");
          if (l) d.lang = l === "pcm" ? "en-NG" : l;
        } catch (e) { d.setAttribute("data-theme", "light"); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>EmergeNG needs JavaScript. In an emergency, call 112.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
